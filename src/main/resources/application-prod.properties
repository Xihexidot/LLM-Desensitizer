# ============================================================
# 生产环境配置
# 启动方式：
#   java -jar app.jar --spring.profiles.active=prod
# 密钥通过系统环境变量注入（不写入文件）：
#   export LLM_OPENAI_KEY=sk-xxx
#   export LLM_DEEPSEEK_KEY=sk-xxx
# ============================================================

# 服务器端口
server.port=8080

# 日志（生产环境减少输出）
logging.level.root=WARN
logging.level.com.hdu.apisensitivities=INFO
logging.level.org.springframework=WARN

# 生产环境不使用 H2 内存数据库，建议换成 MySQL（取消下方注释，配置真实数据库）
# spring.datasource.url=jdbc:mysql://your-db-host:3306/ApiSensitivities?useSSL=true&serverTimezone=Asia/Shanghai
# spring.datasource.username=prod_user
# spring.datasource.password=${DB_PASSWORD}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 不允许加载 local 配置（生产环境密钥通过系统环境变量注入）
spring.profiles.include=
